apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    meta.helm.sh/release-name: postgis
    meta.helm.sh/release-namespace: postgis
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/instance: postgis
    app.kubernetes.io/name: postgis
  name: postgis-backup
  namespace: postgis
spec:
  backoffLimit: 6
  completions: 1
  parallelism: 1
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/component: backup
        app.kubernetes.io/instance: postgis
        app.kubernetes.io/name: postgis
        job-name: postgis-backup
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - /usr/bin/pg_backup.sh
        image: raymondstrose/postgis-backup:13.1
        imagePullPolicy: IfNotPresent
        name: postgis-backup
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: OnFailure
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 0
